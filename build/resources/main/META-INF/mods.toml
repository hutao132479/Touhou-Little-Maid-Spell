
modLoader="javafml" #mandatory
# A version range to match for said mod loader - for regular FML @Mod it will be the forge version
loaderVersion="[47,)" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
license="All Rights Reserved"

[[mods]] #mandatory
# The modid of the mod
modId="touhou_little_maid_spell" #mandatory
# The version number of the mod
version="1.20-1.4.7.1" #mandatory
# A display name for the mod
displayName="Touhou Little Maid: Spell" #mandatory
authors="dreamCat" #optional
description='''add spell combat to Touhou Little Maid.'''

# Mixins configuration
[[mixins]]
config="maidspell.mixins.json"
# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.touhou_little_maid_spell]] #optional
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="[47,)" #mandatory
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT, or SERVER
    side="BOTH"
# Here's another dependency
[[dependencies.touhou_little_maid_spell]]
    modId="minecraft"
    mandatory=true
    # This version range declares a minimum of the current minecraft version up to but not including the next major version
    versionRange="[1.20.1,1.20.2)"
    ordering="NONE"
    side="BOTH"

[[dependencies.touhou_little_maid_spell]]
   modId="touhou_little_maid"
   mandatory=true
   versionRange="[1.2.2,)"
   ordering="AFTER"
   side="BOTH"

[[dependencies.touhou_little_maid_spell]]
    modId = "irons_spellbooks"
    mandatory = false
    versionRange = "[1.20.1-3.4.0,)"
    ordering="NONE"
    side = "BOTH"

[[dependencies.touhou_little_maid_spell]]
    modId="ars_nouveau"
    mandatory=false
    versionRange="[4.8.0,)"
    ordering="NONE"
    side="BOTH"